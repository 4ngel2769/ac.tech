# Sample workflow for building and deploying a Nuxt site to GitHub Pages
#
# To get started with Nuxt see: https://nuxtjs.org/docs/get-started/installation
#
name: Deploy Nuxt site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            dist
            .nuxt
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('dist') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-

      - name: Install dependencies
        run: bun install

      - name: 🧹 Fix .md filename case issues (GitHub Pages Linux quirk)
        run: |
          echo "Checking for uppercase .md filenames..."
          find content -type f -name "*.md" | grep -E '[A-Z]' || echo "None found."
          for f in $(find content -type f -name "*.md" | grep -E '[A-Z]'); do
            newf=$(echo "$f" | tr '[:upper:]' '[:lower:]')
            if [ "$f" != "$newf" ]; then
              echo "Renaming $f → $newf"
              mkdir -p "$(dirname "$newf")"
              mv "$f" "$newf"
            fi
          done

      - name: Static HTML export with Nuxt
        run: bun run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

